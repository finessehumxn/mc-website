<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start a Build | Millennials Creatives</title>
<meta name="description" content="Tell us what you want built in a few taps. Get a rough scope on the spot, and we finish it for you.">
<link rel="icon" href="assets/mc-logo.png">
<style>
:root{--bg:oklch(0.115 0.03 286);--surface:oklch(0.165 0.033 286);--panel:oklch(0.215 0.037 287);--yellow:oklch(0.885 0.158 91);--pink:oklch(0.63 0.229 5);--cyan:oklch(0.79 0.128 219);--text:oklch(0.97 0.005 280);--muted:oklch(0.72 0.017 285);--line:oklch(1 0 0 / 10%);--ff:'Poppins',ui-sans-serif,system-ui,-apple-system,Helvetica,Arial,sans-serif;}
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--ff);line-height:1.55;min-height:100vh}
a{color:inherit;text-decoration:none}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--yellow);color:var(--panel);padding:12px 20px;z-index:9999;font-weight:700}
.skip-link:focus{left:0}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:66px;max-width:1100px;margin:0 auto;padding:0 24px}
.brand img{height:42px;display:block}
.exit{font-size:.85rem;color:var(--muted)}.exit:hover{color:var(--text)}
.stage{max-width:720px;margin:0 auto;padding:30px 24px 80px;min-height:calc(100vh - 66px);display:flex;flex-direction:column}
.progress{display:flex;gap:8px;margin-bottom:8px}
.progress i{height:5px;flex:1;background:var(--line);border-radius:3px;transition:background .3s}
.progress i.on{background:var(--yellow)}
.pcount{font-size:.75rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:30px}
.card{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.q-eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);margin-bottom:12px}
.q-title{font-family:var(--ff);font-weight:800;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.05;letter-spacing:-.02em;margin-bottom:8px}
.q-hint{color:var(--muted);font-size:1rem;margin-bottom:28px}
.choices{display:grid;gap:12px}
.choices.two{grid-template-columns:1fr 1fr}
@media(max-width:560px){.choices.two{grid-template-columns:1fr}}
.choice{display:flex;align-items:center;gap:16px;padding:20px 22px;background:var(--surface);border:2px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color .2s,background .2s,transform .1s;text-align:left;width:100%;font-family:var(--ff);color:var(--text)}
.choice:hover{border-color:var(--yellow);background:var(--panel)}
.choice:active{transform:scale(.99)}
.choice.sel{border-color:var(--yellow);background:color-mix(in oklab,var(--yellow) 10%,var(--surface))}
.choice .emoji{font-size:1.7rem;line-height:1;flex-shrink:0}
.choice .ctext{display:flex;flex-direction:column}
.choice b{font-size:1.05rem;font-weight:600}
.choice em{font-style:normal;font-size:.85rem;color:var(--muted);margin-top:2px}
.choice .tick{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.choice.sel .tick{background:var(--yellow);border-color:var(--yellow);color:oklch(0.12 0.03 286)}
.field{margin-bottom:16px}
.field label{display:block;font-size:.9rem;font-weight:600;margin-bottom:8px}
.field input,.field textarea{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;color:var(--text);font-family:var(--ff);font-size:1rem}
.field input:focus,.field textarea:focus{border-color:var(--yellow)}
.field textarea{min-height:130px;resize:vertical}
.nav-row{display:flex;gap:12px;align-items:center;margin-top:auto;padding-top:34px}
.btn{padding:15px 30px;border-radius:32px;font-weight:700;font-size:1rem;transition:transform .2s;border:none;cursor:pointer;font-family:var(--ff)}
.btn-y{background:var(--yellow);color:oklch(0.12 0.03 286);box-shadow:0 18px 60px -18px color-mix(in oklab,var(--yellow) 55%,transparent)}
.btn-y[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:not([disabled]):hover{transform:translateY(-2px)}
.spacer{flex:1}
.skip-q{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;text-decoration:underline;font-family:var(--ff)}
.scope-chip{display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:10px 18px;margin-bottom:24px}
.scope-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan)}
.scope-chip b{color:var(--yellow)}.scope-chip span{color:var(--muted);font-size:.85rem}
.final-scope{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:24px}
.final-scope .fl{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.final-scope .ft{font-family:var(--ff);font-weight:800;font-size:2rem;color:var(--yellow);margin-top:6px}
.final-scope .fm{color:var(--muted);margin-top:4px}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--muted);font-size:.8rem}
.trust b{color:var(--text)}
.done-emoji{font-size:3rem}
</style>
</head>
<body>
<a class="skip-link" href="#stage">Skip to the build wizard</a>
<header><nav>
  <a href="index.html" class="brand"><img src="assets/mc-logo.png" alt="Millennials Creatives"></a>
  <a href="index.html" class="exit">Exit &#10005;</a>
</nav></header>
<main class="stage" id="stage">
  <div class="progress" id="prog"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pcount" id="pcount">Step 1 of 5</div>
  <div id="card"></div>
</main>
<script>
(function(){
  var state={type:[],feat:[],stage:null,timeline:null,vision:'',name:'',email:'',company:''};
  var step=0;
  var card=document.getElementById('card'), prog=document.getElementById('prog'), pcount=document.getElementById('pcount');
  var bars=prog.querySelectorAll('i');
  var TYPES=[['\uD83D\uDCF1','A mobile app','iPhone, Android, or both',2],['\uD83C\uDF10','A website or web app','Marketing site or a full platform',2],['\uD83D\uDCB3','A SaaS product','Software people log into and pay for',3],['\uD83E\uDD16','An AI tool or assistant','Chatbot, automation, smart features',3],['\uD83D\uDCCA','An internal tool','Dashboards, admin, workflow',2],['\uD83D\uDCA1','Not sure yet','Help me figure it out',1]];
  var FEATS=[['\uD83D\uDD10','User accounts / login','',1],['\uD83D\uDCB0','Payments / subscriptions','',2],['\u2728','AI / automation','',2],['\uD83D\uDD14','Messaging / notifications','',1],['\uD83D\uDCC8','Dashboards / reporting','',2],['\uD83D\uDD17','Connects to other tools','',2],['\uD83D\uDEE0\uFE0F','Admin panel','',1],['\u267F','Accessibility / 508','',2]];
  var STAGES=[['\uD83D\uDCAD','Just an idea',1],['\uD83D\uDCDD','Notes or sketches',2],['\uD83C\uDFA8','Designs or a spec',2],['\uD83C\uDFD7\uFE0F','Half-built, need it finished',1]];
  var TIMES=[['\uD83E\uDDD8','No rush, do it right',1],['\uD83D\uDCC5','Within a few months',1.15],['\u26A1','As soon as possible',1.3]];
  function scope(){var s=0,c=0;state.type.forEach(function(i){s+=TYPES[i][3];c++;});state.feat.forEach(function(i){s+=FEATS[i][3];});var mult=(state.stage!==null?STAGES[state.stage][2]:1)*(state.timeline!==null?TIMES[state.timeline][2]:1);var t=s*mult;if(c===0)return null;if(t<=6)return['Starter Build','$5K\u2013$15K \u00b7 3 to 6 weeks'];if(t<=14)return['Core Build','$15K\u2013$40K \u00b7 6 to 12 weeks'];if(t<=26)return['Platform Build','$40K\u2013$90K \u00b7 3 to 5 months'];return['Enterprise / Gov Build','$100K+ \u00b7 custom SOW'];}
  function chip(){var sc=scope();if(!sc)return'';return'<div class="scope-chip"><span class="dot"></span><b>'+sc[0]+'</b><span>'+sc[1]+'</span></div>';}
  function setProg(){bars.forEach(function(b,i){b.classList.toggle('on',i<=step);});pcount.textContent='Step '+(Math.min(step,4)+1)+' of 5';}
  function multiCard(eyebrow,title,hint,list,key,cols){var html='<div class="card">'+(step>0?chip():'')+'<div class="q-eyebrow">'+eyebrow+'</div><div class="q-title">'+title+'</div><div class="q-hint">'+hint+'</div><div class="choices '+(cols||'')+'">';list.forEach(function(o,i){var sel=state[key].indexOf(i)>-1?' sel':'';var em=o[2]?'<em>'+o[2]+'</em>':'';html+='<button class="choice'+sel+'" data-i="'+i+'"><span class="emoji">'+o[0]+'</span><span class="ctext"><b>'+o[1]+'</b>'+em+'</span><span class="tick">\u2713</span></button>';});html+='</div><div class="nav-row">'+(step>0?'<button class="btn btn-ghost" id="back">\u2190 Back</button>':'')+'<div class="spacer"></div><button class="btn btn-y" id="next"'+(state[key].length?'':' disabled')+'>Continue \u2192</button></div></div>';card.innerHTML=html;card.querySelectorAll('.choice').forEach(function(b){b.addEventListener('click',function(){var i=+b.dataset.i,idx=state[key].indexOf(i);if(idx>-1)state[key].splice(idx,1);else state[key].push(i);render();});});wireNav();}
  function singleCard(eyebrow,title,hint,list,key,cols){var html='<div class="card">'+chip()+'<div class="q-eyebrow">'+eyebrow+'</div><div class="q-title">'+title+'</div><div class="q-hint">'+hint+'</div><div class="choices '+(cols||'')+'">';list.forEach(function(o,i){var sel=state[key]===i?' sel':'';html+='<button class="choice'+sel+'" data-i="'+i+'"><span class="emoji">'+o[0]+'</span><span class="ctext"><b>'+o[1]+'</b></span><span class="tick">\u2713</span></button>';});html+='</div><div class="nav-row"><button class="btn btn-ghost" id="back">\u2190 Back</button><div class="spacer"></div><button class="btn btn-y" id="next"'+(state[key]!==null?'':' disabled')+'>Continue \u2192</button></div></div>';card.innerHTML=html;card.querySelectorAll('.choice').forEach(function(b){b.addEventListener('click',function(){state[key]=+b.dataset.i;render();});});wireNav();}
  function visionCard(){var html='<div class="card">'+chip()+'<div class="q-eyebrow">Almost there</div><div class="q-title">Tell us the vision, in your words.</div><div class="q-hint">Plain language is perfect. What is it, who is it for, what problem does it solve? Skip if you\u2019d rather talk it through.</div><div class="field"><textarea id="vision" placeholder="Example: an app that lets local bakeries take custom cake orders and deposits online, so they stop losing orders in DMs.">'+state.vision+'</textarea></div><div class="nav-row"><button class="btn btn-ghost" id="back">\u2190 Back</button><button class="skip-q" id="skipq">Skip this</button><div class="spacer"></div><button class="btn btn-y" id="next">Continue \u2192</button></div></div>';card.innerHTML=html;card.querySelector('#vision').addEventListener('input',function(e){state.vision=e.target.value;});card.querySelector('#skipq').addEventListener('click',function(){step++;render();});wireNav();}
  function contactCard(){var sc=scope();var html='<div class="card"><div class="final-scope"><div class="fl">Your rough scope</div><div class="ft">'+(sc?sc[0]:'Custom Build')+'</div><div class="fm">'+(sc?sc[1]:'We\u2019ll scope it with you')+'</div></div><div class="q-title" style="font-size:1.6rem">Where do we send it?</div><div class="q-hint">We\u2019ll reply within 24 hours with next steps.</div><div class="field"><label for="name">Your name</label><input id="name" type="text" placeholder="First and last" value="'+state.name+'"></div><div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@company.com" value="'+state.email+'"></div><div class="field"><label for="company">Company or project (optional)</label><input id="company" type="text" value="'+state.company+'"></div><div class="nav-row"><button class="btn btn-ghost" id="back">\u2190 Back</button><div class="spacer"></div><button class="btn btn-y" id="send">Send my request \u2192</button></div><div class="trust"><div><b>Certified</b> WOSB \u00b7 MBE \u00b7 DBE</div><div><b>In-house</b> team</div><div><b>24-hr</b> response</div></div></div>';card.innerHTML=html;['name','email','company'].forEach(function(id){card.querySelector('#'+id).addEventListener('input',function(e){state[id]=e.target.value;});});card.querySelector('#back').addEventListener('click',function(){step--;render();});card.querySelector('#send').addEventListener('click',send);}
  function thankYou(){prog.style.display='none';pcount.style.display='none';card.innerHTML='<div class="card" style="text-align:center;padding-top:30px"><div class="done-emoji">\uD83C\uDF89</div><div class="q-title" style="margin-top:16px">Your build request is ready.</div><div class="q-hint">Your email app just opened with everything filled in. Hit send and we\u2019ll reply within 24 hours. Didn\u2019t open? Email us at contact@millennialscreatives.com.</div><a href="index.html" class="btn btn-y" style="display:inline-block;margin-top:10px">Back to home</a></div>';}
  function wireNav(){var back=card.querySelector('#back'),next=card.querySelector('#next');if(back)back.addEventListener('click',function(){step--;render();});if(next)next.addEventListener('click',function(){step++;render();});}
  function send(){function names(sel,list){return sel.map(function(i){return list[i][1];}).join(', ')||'(none)';}var sc=scope();var body='BUILD REQUEST \u2014 Millennials Creatives\n\nName: '+(state.name||'(no name)')+'\nEmail: '+state.email+'\nCompany/Project: '+state.company+'\n\nType: '+names(state.type,TYPES)+'\nFeatures: '+names(state.feat,FEATS)+'\nStage: '+(state.stage!==null?STAGES[state.stage][1]:'-')+'\nTimeline: '+(state.timeline!==null?TIMES[state.timeline][1]:'-')+'\nRough scope: '+(sc?sc[0]+' ('+sc[1]+')':'custom')+'\n\nVision:\n'+(state.vision||'(not provided)')+'\n';var subj='New Build Request'+(state.company?(' \u2014 '+state.company):'');window.location.href='mailto:contact@millennialscreatives.com?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);setTimeout(thankYou,400);}
  function render(){setProg();if(step===0)multiCard('Step 1','What do you want to build?','Pick anything that fits. You can choose more than one.',TYPES,'type','two');else if(step===1)multiCard('Step 2','What should it do?','Tap the features you know you\u2019ll need.',FEATS,'feat','two');else if(step===2)singleCard('Step 3','Where are you now?','How far along is the idea?',STAGES,'stage','two');else if(step===3)singleCard('Step 4','How soon do you need it?','Be honest, it helps us plan.',TIMES,'timeline','two');else if(step===4)visionCard();else contactCard();window.scrollTo(0,0);}
  render();
})();
</script>
</body>
</html>
